[package]
name = "diataxis"
version = "0.1.0"
edition = "2024"
description = "Diataxis documentation sets as typed markdown, for humans and coding agents"
license = "MIT"
repository = "https://github.com/cjohnhanson/diataxis"
homepage = "https://github.com/cjohnhanson/diataxis"
readme = "README.md"
authors = ["Cody Hanson"]
keywords = ["documentation", "diataxis", "markdown", "plaintext", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    ".tisket/",
    "tisket.yml",
    ".zettel/",
    "zettel.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "tests/missouri/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

[dependencies]
# The store half: pages, types, the check, and the bundled set.
camino = { version = "1", features = ["serde1"], optional = true }
mdstore = { version = "0.3", package = "mdstore-core", optional = true }
regex = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = { version = "2", optional = true }
yaml_serde = { version = "0.10", optional = true }

# The command-line half. A tool that takes this crate for its `docs`
# subcommand and parses its own arguments pays for none of it. gaff is
# that tool: clap exits 2 on a usage error, and 2 is the code gaff
# reserves for a guard refusing a tool call.
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"], optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
colored = { version = "3.1.1", optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
sigpipe = { version = "0.1.3", optional = true }

[features]
default = ["cli"]
# Read and write pages, and serve a bundled documentation set.
store = ["dep:camino", "dep:mdstore", "dep:regex", "dep:serde", "dep:thiserror", "dep:yaml_serde"]
# The binary, and the clap surface it is built from.
cli = ["store", "dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:colored", "dep:miette", "dep:sigpipe"]
# The build-script helper, which carries no dependencies at all. A
# build-dependency on this crate takes this feature and nothing else.
build = []

[[bin]]
name = "diataxis"
required-features = ["cli"]

# A released binary carries no debug symbols, and a user installing a
# CLI never reads them. Thin LTO with one codegen unit trades build
# time for size and speed. A release builds once and installs often.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
