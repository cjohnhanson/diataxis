assertions:
  - name: "a file that declares no type is a fault"
    command: "diataxis check | grep -q 'notes.md.*not a page'"
  - name: "a fault exits non-zero"
    command: "diataxis check"
    should_fail: true
  - name: "the file does not list as a page"
    command: "! diataxis page list | grep -q notes"
  - name: "the map passes over it"
    command: "test $(diataxis map | grep -c '(none)') -eq 3"
