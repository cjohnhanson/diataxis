# Unit tests for the scripts that family-checks.yml runs in each tool
# repository. This file is not generated by gaff.
name: family scripts
on:
  pull_request:
    paths: [scripts/family/**, .github/workflows/family-*.yml]
  push:
    branches: [main]
    paths: [scripts/family/**, .github/workflows/family-*.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --with markdown-it-py==4.2.0 python -m unittest discover -v scripts/family
