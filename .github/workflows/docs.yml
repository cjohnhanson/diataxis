# The family docs checks: the docs test exists, tool commands sit in
# blocks it runs, the README shape, spelling, and links. Not generated by
# gaff. This repository hosts the shared workflow, so it calls its own
# copy by path; every other family tool calls
# cjohnhanson/diataxis/.github/workflows/family-checks.yml@main.
name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  family:
    uses: ./.github/workflows/family-checks.yml
    with:
      tool: diataxis
