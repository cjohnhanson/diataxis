# The family docs checks: the docs test exists, tool commands sit in
# blocks it runs, the README shape, spelling, and links. Not generated by
# gaff. This repository hosts the shared workflow, so it calls its own
# copy by path; every other family tool calls
# cjohnhanson/diataxis/.github/workflows/family-checks.yml@main. `ref`
# names the commit under test, so the job runs that commit's
# scripts/family, not main's: the pull request head, or the pushed sha.
name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  family:
    uses: ./.github/workflows/family-checks.yml
    with:
      tool: diataxis
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
